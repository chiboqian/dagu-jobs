[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-ops"
version = "0.1.0"
description = "Shared clients for Gmail, Cloudflare R2 and D1 (and the Dagu tooling in this repo)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
r2 = ["boto3"]

[tool.setuptools]
packages = ["luna_ops"]
